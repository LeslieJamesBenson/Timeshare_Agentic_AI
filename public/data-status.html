<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Chart Data Status</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1a1f29; --muted:#5b6472; --line:#e3e7ec; --accent:#1f5fa8;
    --good:#17693a; --warn:#8a5a00; --bad:#a12222; --chip:#eef2f7; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; }
  a { color:var(--accent); }
  .wrap { max-width:1040px; margin:0 auto; padding:24px 20px 64px; }
  header.top { display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:8px; margin-bottom:20px; }
  h1 { font-size:22px; margin:0; } .nav a { margin-left:16px; font-size:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; margin-bottom:18px; }
  .kpis { display:grid; grid-template-columns:repeat(5,1fr); gap:12px; }
  @media (max-width:720px){ .kpis{ grid-template-columns:repeat(2,1fr);} }
  .kpi { border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
  .kpi b { display:block; font-size:26px; letter-spacing:-.02em; } .kpi span { color:var(--muted); font-size:13px; }
  .tablewrap { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th,td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); }
  td.num,th.num { text-align:right; } th { font-size:12px; text-transform:uppercase; color:var(--muted); letter-spacing:.03em; }
  .st { font-size:12px; font-weight:600; padding:2px 8px; border-radius:999px; }
  .st.active { background:#e6f4ec; color:var(--good);} .st.warning{ background:#fbf1dd; color:var(--warn);}
  .st.blocked,.st.unsupported{ background:#fbe6e6; color:var(--bad);}
  .toolbar { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:12px; }
  input,select { font:inherit; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); }
  details { margin-top:4px; } details summary { cursor:pointer; color:var(--muted); font-size:12px; }
  .issue { font-size:12px; margin:2px 0; } .issue.error{ color:var(--bad);} .issue.warning{ color:var(--warn);}
  @media (prefers-color-scheme: dark){
    :root{ --bg:#12151b; --card:#1b1f27; --ink:#e8ebef; --muted:#9aa4b2; --line:#2b313b; --accent:#4f93d6; }
    input,select{ background:#232a34; color:var(--ink);}
    .st.active{background:#153524;} .st.warning{background:#352b12;} .st.blocked,.st.unsupported{background:#341717;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Chart Data Status</h1>
    <nav class="nav"><a href="/calculator">Calculator</a><a href="/planner">Planner</a><a href="/data-status">Data status</a></nav>
  </header>
  <p class="muted" id="meta">Loading…</p>
  <div class="card"><div class="kpis" id="kpis"></div></div>
  <div class="card">
    <div class="toolbar">
      <input type="text" id="filter" placeholder="Filter by resort or source file…" />
      <select id="statusFilter">
        <option value="">All statuses</option>
        <option value="active">Active</option>
        <option value="warning">Warning</option>
        <option value="blocked">Blocked</option>
        <option value="unsupported">Unsupported</option>
      </select>
    </div>
    <div class="tablewrap">
      <table>
        <thead><tr><th>Resort</th><th>Source file</th><th>Effective period</th><th>Status</th><th class="num">Errors</th><th class="num">Warnings</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>
</div>
<script>
let all = [];
async function load(){
  const res = await fetch('/api/credit-status');
  const data = await res.json();
  if(!data.ok){ document.getElementById('meta').textContent = 'No report — run: npm run credits:build'; return; }
  const t = data.totals;
  document.getElementById('meta').textContent = 'Imported ' + new Date(data.importedAt).toLocaleString() + ' · ' + t.sourceFiles + ' source files · ' + t.rateCombinations + ' rate combinations';
  document.getElementById('kpis').innerHTML = [
    ['Active', t.active], ['Warning', t.warning], ['Blocked', t.blocked], ['Unsupported', t.unsupported], ['Total', t.normalized]
  ].map(([k,v])=>`<div class="kpi"><b>${v}</b><span>${k}</span></div>`).join('');
  all = data.resorts;
  render();
}
function render(){
  const q = document.getElementById('filter').value.toLowerCase();
  const sf = document.getElementById('statusFilter').value;
  const rows = all.filter(r =>
    (!sf || r.status===sf) &&
    (!q || (r.resortName||'').toLowerCase().includes(q) || (r.sourceFile||'').toLowerCase().includes(q))
  ).map(r => {
    const issues = (r.issues||[]).filter(i=>i.severity!=='info');
    const det = issues.length ? `<details><summary>${issues.length} issue(s)</summary>${issues.map(i=>`<div class="issue ${i.severity}">${i.severity}: ${i.message}</div>`).join('')}</details>` : '';
    return `<tr>
      <td>${r.resortName || '<em>—</em>'}${det}</td>
      <td class="muted">${r.sourceFile||''}</td>
      <td>${r.effectivePeriod||'—'}</td>
      <td><span class="st ${r.status}">${r.status}</span></td>
      <td class="num">${r.errorCount||0}</td>
      <td class="num">${r.warningCount||0}</td>
    </tr>`;
  }).join('');
  document.getElementById('rows').innerHTML = rows || '<tr><td colspan="6" class="muted">No matches.</td></tr>';
}
document.getElementById('filter').addEventListener('input', render);
document.getElementById('statusFilter').addEventListener('change', render);
load();
</script>
</body>
</html>
