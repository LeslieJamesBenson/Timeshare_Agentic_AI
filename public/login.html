<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rep Sign In — WorldMark Sales Tool</title>
  <style>
    :root { --wm-blue: #003b6f; --wm-accent: #0071c2; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #003b6f 0%, #0071c2 100%);
      color: #1a2530;
    }
    .card {
      background: #fff; width: 360px; max-width: 92vw; padding: 32px;
      border-radius: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.25);
    }
    h1 { font-size: 1.15rem; margin: 0 0 4px; color: var(--wm-blue); }
    p.sub { margin: 0 0 22px; font-size: .85rem; color: #5a6b7b; }
    label { display: block; font-size: .8rem; font-weight: 600; margin-bottom: 6px; color: #33475b; }
    input {
      width: 100%; padding: 11px 12px; border: 1px solid #cdd7e1; border-radius: 8px;
      font-size: 1rem; margin-bottom: 16px;
    }
    input:focus { outline: none; border-color: var(--wm-accent); box-shadow: 0 0 0 3px rgba(0,113,194,.15); }
    button {
      width: 100%; padding: 12px; border: 0; border-radius: 8px; cursor: pointer;
      background: var(--wm-accent); color: #fff; font-size: 1rem; font-weight: 600;
    }
    button:hover { background: #005a9e; }
    button:disabled { opacity: .6; cursor: default; }
    .err { color: #c0392b; font-size: .82rem; min-height: 1.1em; margin: 0 0 12px; }
    .note { margin-top: 18px; font-size: .72rem; color: #8095a8; text-align: center; }
  </style>
</head>
<body>
  <div class="card">
    <h1>WorldMark Sales Tool</h1>
    <p class="sub">Internal rep access only.</p>
    <form id="login-form">
      <label for="pw">Shared password</label>
      <input id="pw" type="password" autocomplete="current-password" autofocus required />
      <p class="err" id="err"></p>
      <button id="submit" type="submit">Sign in</button>
    </form>
    <p class="note">Authorized reps only. Sessions expire automatically.</p>
  </div>
  <script>
    const form = document.getElementById('login-form');
    const err = document.getElementById('err');
    const btn = document.getElementById('submit');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.textContent = '';
      btn.disabled = true;
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: document.getElementById('pw').value })
        });
        if (res.ok) {
          const params = new URLSearchParams(location.search);
          location.href = params.get('next') || '/sales-agent.html';
          return;
        }
        err.textContent = res.status === 429
          ? 'Too many attempts — wait a moment and try again.'
          : 'Incorrect password.';
      } catch {
        err.textContent = 'Network error — try again.';
      }
      btn.disabled = false;
    });
  </script>
</body>
</html>
